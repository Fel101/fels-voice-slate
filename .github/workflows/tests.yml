name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these on a tag's commit before it builds anything.
  workflow_call:
    inputs:
      ref:
        description: The commit to test, such as refs/tags/v1.0.0. Empty tests the caller's own commit.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m pyflakes recorder tests tools

      - name: Test
        run: python -m pytest -n auto
        env:
          QT_QPA_PLATFORM: offscreen
